services:
  sync:
    image: ghcr.io/nogipx/rhyolite-headless:1.0.0
    restart: unless-stopped
    user: "${RHYOLITE_UID:?set RHYOLITE_UID}:${RHYOLITE_GID:?set RHYOLITE_GID}"
    environment:
      HOME: /state
      RHYOLITE_VAULT_PATH: /vault
      RHYOLITE_PASSPHRASE_FILE: /secrets/passphrase
    volumes:
      - ${VAULT_PATH:?set VAULT_PATH}:/vault
      - ./state:/state
      - ./secrets:/secrets:ro
    command: ["daemon"]
